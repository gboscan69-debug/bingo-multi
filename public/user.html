<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Mobile - Jugador</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        :root {
            --bg-dark: #0f172a; --surface-dark: #1e293b; --surface-glass: rgba(30, 41, 59, 0.75);
            --primary-neon: #38bdf8; --secondary-neon: #818cf8; --accent-pink: #f43f5e;
            --success-neon: #22c55e; --warning-gold: #fbbf24; --text-main: #f8fafc; --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 0 0 140px 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .economy-bar { background: var(--surface-glass); backdrop-filter: blur(12px); padding: 12px 20px; width: 100%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 90; }
        .diamond-badge { background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.2)); border: 1px solid rgba(56, 189, 248, 0.4); padding: 8px 16px; border-radius: 30px; font-weight: 800; font-size: 14px; color: var(--primary-neon); }
        .room-nav { display: flex; width: 95%; max-width: 900px; margin: 16px 0 8px 0; background: var(--surface-dark); padding: 4px; border-radius: 14px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; font-size: 13px; border-radius: 10px; cursor: pointer; }
        .tab-btn.active { background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon)); color: #0f172a; }
        .cards-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 1100px; padding: 12px; }
        .bingo-card { background: var(--surface-glass); border-radius: 20px; padding: 10px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .bingo-header { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-bottom: 4px; }
        .header-cell { color: var(--primary-neon); font-weight: 800; padding: 4px 0; font-size: 13px; text-align: center; }
        .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
        .cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); font-weight: 700; font-size: 12px; background: rgba(255,255,255,0.03); color: var(--text-main); cursor: pointer; }
        .cell.marked { background: linear-gradient(135deg, var(--success-neon), #16a34a); color: #0f172a; font-weight: 800; }
        .cell.free { background: linear-gradient(135deg, var(--warning-gold), #d97706); color: #0f172a; font-size: 8px; font-weight: 800; }
        .btn-buy, .btn-bingo { margin-top: 10px; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: 800; cursor: pointer; color: white; }
        .btn-buy { background: linear-gradient(135deg, #f97316, #ea580c); }
        .btn-bingo { background: linear-gradient(135deg, var(--accent-pink), #e11d48); }
        .caller-bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); padding: 12px 20px; z-index: 100; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.1); }
        .current-ball-mobile { width: 50px; height: 50px; line-height: 50px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, var(--accent-pink), #be123c); color: white; font-size: 18px; font-weight: 800; text-align: center; }
    </style>
</head>
<body>
    <div class="economy-bar">
        <div class="diamond-badge">💎 <span id="diamondCount">100</span></div>
        <button onclick="diamonds+=50; updateUI();" style="background:var(--success-neon); border:none; padding:6px 12px; border-radius:8px; font-weight:700; cursor:pointer;">+50 Diamantes</button>
    </div>
    <div class="room-nav">
        <button class="tab-btn active" id="tabGeneral" onclick="switchRoom('general')">🏪 Tienda de Cartones</button>
        <button class="tab-btn" id="tabPrivate" onclick="switchRoom('private')">🔒 Mis Cartones</button>
    </div>
    <main id="app" style="width: 100%; display: flex; justify-content: center;"></main>
    <div class="caller-bottom-bar">
        <div>
            <div style="font-size: 9px; color: var(--text-muted); font-weight: 800;">ÚLTIMA BOLA CANTADA</div>
            <div id="lastBallText" style="font-weight: 700; font-size: 14px; color: var(--primary-neon);">Esperando partida...</div>
        </div>
        <div class="current-ball-mobile" id="currentBallMini">--</div>
    </div>
    <script>
        const socket = io();
        const CARD_PRICE = 10;
        let currentRoom = 'general';
        let userId = 'User_' + Math.floor(Math.random() * 8999 + 1000);
        let diamonds = 100;
        let boughtCardsMap = {};
        let markedCellsMap = {};
        let drawnBalls = [];
        let gameRound = 1;

        socket.on('server_ball_drawn', (data) => {
            drawnBalls = data.drawnBalls;
            updateUI();
        });

        socket.on('server_reset_game', (data) => {
            drawnBalls = [];
            boughtCardsMap = {};
            markedCellsMap = {};
            if(data && data.gameRound) gameRound = data.gameRound;
            updateUI();
        });

        function updateUI() {
            document.getElementById('diamondCount').innerText = diamonds;
            if (drawnBalls.length > 0) {
                const last = drawnBalls[drawnBalls.length - 1];
                const letter = last <= 15 ? 'B' : last <= 30 ? 'I' : last <= 45 ? 'N' : last <= 60 ? 'G' : 'O';
                document.getElementById('currentBallMini').innerText = `${letter}-${last}`;
                document.getElementById('lastBallText').innerText = `Jugando en tiempo real`;
            } else {
                document.getElementById('currentBallMini').innerText = '--';
                document.getElementById('lastBallText').innerText = `Esperando partida...`;
            }
            renderCards();
        }

        function switchRoom(room) {
            currentRoom = room;
            document.getElementById('tabGeneral').classList.toggle('active', room === 'general');
            document.getElementById('tabPrivate').classList.toggle('active', room === 'private');
            updateUI();
        }

        function getSeededNumbers(min, max, count, seed) {
            let numbers = [];
            let currentSeed = seed;
            while (numbers.length < count) {
                let x = Math.sin(currentSeed++) * 10000;
                let randomNum = Math.floor((x - Math.floor(x)) * (max - min + 1)) + min;
                if (!numbers.includes(randomNum)) numbers.push(randomNum);
            }
            return numbers;
        }

        function getCardMatrix(cardNumber) {
            const baseSeed = (cardNumber * 1000) + (gameRound * 100);
            const colB = getSeededNumbers(1, 15, 5, baseSeed + 1);
            const colI = getSeededNumbers(16, 30, 5, baseSeed + 2);
            const colN = getSeededNumbers(31, 45, 4, baseSeed + 3);
            const colG = getSeededNumbers(46, 60, 5, baseSeed + 4);
            const colO = getSeededNumbers(61, 75, 5, baseSeed + 5);

            let matrix = [];
            for (let r = 0; r < 5; r++) {
                let row = [];
                row.push(colB[r]); row.push(colI[r]);
                row.push(r === 2 ? 0 : colN[r < 2 ? r : r - 1]);
                row.push(colG[r]); row.push(colO[r]);
                matrix.push(row);
            }
            return matrix;
        }

        function buyCard(cardNumber) {
            if (drawnBalls.length > 0) { alert("La partida ya comenzó."); return; }
            if (diamonds < CARD_PRICE) { alert("No tienes suficientes diamantes."); return; }
            diamonds -= CARD_PRICE;
            boughtCardsMap[cardNumber] = { owner: userId };
            switchRoom('private');
        }

        function toggleCellMark(cardNumber, row, col) {
            const key = `${cardNumber}_${row}_${col}`;
            if (markedCellsMap[key]) delete markedCellsMap[key];
            else markedCellsMap[key] = true;
            updateUI();
        }

        function renderCards() {
            const app = document.getElementById('app');
            app.innerHTML = '';
            const container = document.createElement('div');
            container.classList.add('cards-container');

            for (let i = 1; i <= 10; i++) {
                const cardInfo = boughtCardsMap[i];
                const isPurchased = !!cardInfo;
                const isOwner = isPurchased && cardInfo.owner === userId;

                if (currentRoom === 'general' && isPurchased) continue;
                if (currentRoom === 'private' && !isOwner) continue;

                const cardDiv = document.createElement('div');
                cardDiv.classList.add('bingo-card');
                cardDiv.innerHTML = `<h3 style="margin:0 0 6px 0; font-size:13px; font-weight:800;">Cartón #${i} ${isOwner ? '(Tuyo)' : ''}</h3>`;

                const header = document.createElement('div');
                header.classList.add('bingo-header');
                ['B', 'I', 'N', 'G', 'O'].forEach(l => header.innerHTML += `<div class="header-cell">${l}</div>`);
                cardDiv.appendChild(header);

                const matrix = getCardMatrix(i);
                const grid = document.createElement('div');
                grid.classList.add('bingo-grid');

                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        const cell = document.createElement('div');
                        cell.classList.add('cell');
                        const val = matrix[r][c];

                        if (r === 2 && c === 2) {
                            cell.innerText = 'FREE';
                            cell.classList.add('free', 'marked');
                        } else {
                            cell.innerText = val;
                            if (markedCellsMap[`${i}_${r}_${c}`]) cell.classList.add('marked');
                            if (isOwner) cell.onclick = () => toggleCellMark(i, r, c);
                        }
                        grid.appendChild(cell);
                    }
                }
                cardDiv.appendChild(grid);

                if (!isPurchased && currentRoom === 'general') {
                    const btnBuy = document.createElement('button');
                    btnBuy.classList.add('btn-buy');
                    btnBuy.innerText = drawnBalls.length > 0 ? '🚫 Ventas Cerradas' : `Comprar (💎 ${CARD_PRICE})`;
                    if (drawnBalls.length === 0) btnBuy.onclick = () => buyCard(i);
                    cardDiv.appendChild(btnBuy);
                } else if (isOwner) {
                    const btnBingo = document.createElement('button');
                    btnBingo.classList.add('btn-bingo');
                    btnBingo.innerText = '📢 ¡Cantar Bingo!';
                    btnBingo.onclick = () => alert("¡Bingo cantado al administrador!");
                    cardDiv.appendChild(btnBingo);
                }
                container.appendChild(cardDiv);
            }
            app.appendChild(container);
        }

        window.onload = updateUI;
    </script>
</body>
</html>
