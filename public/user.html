<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Royale - Bingo Pro</title>
    <script src="/socket.io/socket.io.js" onerror="window.socketFailed=true;"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --bg-base: #090d16;
            --surface-card: rgba(20, 27, 45, 0.85);
            --surface-glass: rgba(30, 41, 59, 0.65);
            --primary-neon: #0ea5e9;
            --primary-glow: rgba(14, 165, 233, 0.3);
            --accent-gold: #f59e0b;
            --accent-pink: #f43f5e;
            --success-neon: #10b981;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: var(--bg-base); 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(14, 165, 233, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(244, 63, 94, 0.06) 0%, transparent 40%);
            color: var(--text-main); 
            margin: 0; 
            padding: 0 0 160px 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }

        /* Pantalla de Login / Autenticación */
        #authOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--surface-card);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
        }

        .auth-card h2 {
            margin-top: 0;
            color: var(--primary-neon);
            font-size: 22px;
            margin-bottom: 8px;
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .auth-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .auth-input:focus { border-color: var(--primary-neon); }

        .btn-auth {
            width: 100%;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            color: white;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
            transition: filter 0.2s;
        }
        .btn-auth:hover { filter: brightness(1.1); }

        /* Barra Superior Económica */
        .economy-bar { 
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px); 
            border-bottom: 1px solid var(--border-glass);
            padding: 14px 24px; 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 90; 
        }

        .badges-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .diamond-badge { 
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.15), rgba(56, 189, 248, 0.25)); 
            border: 1px solid rgba(56, 189, 248, 0.4); 
            padding: 8px 18px; 
            border-radius: 30px; 
            font-weight: 800; 
            font-size: 14px; 
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.15);
        }

        .audio-toggle-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 8px 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            color: #34d399;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .audio-toggle-badge.muted {
            background: rgba(244, 63, 94, 0.15);
            border-color: rgba(244, 63, 94, 0.4);
            color: #fb7185;
        }

        .user-info-badge {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* Navegación por Pestañas */
        .room-nav { 
            display: flex; 
            width: 92%; 
            max-width: 600px; 
            margin: 20px 0 12px 0; 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid var(--border-glass);
            padding: 6px; 
            border-radius: 16px; 
            backdrop-filter: blur(10px);
        }

        .tab-btn { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            background: transparent; 
            color: var(--text-muted); 
            font-weight: 700; 
            font-size: 13px; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .tab-btn.active { 
            background: linear-gradient(135deg, #0ea5e9, #6366f1); 
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
        }

        /* Contenedor de Historial de Pelotas Sacadas */
        .history-container {
            width: 92%;
            max-width: 900px;
            background: var(--surface-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 14px 18px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .history-header {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-balls-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-neon) rgba(255, 255, 255, 0.05);
        }

        .history-balls-scroll::-webkit-scrollbar { height: 6px; }
        .history-balls-scroll::-webkit-scrollbar-thumb { background: var(--primary-neon); border-radius: 4px; }

        .history-ball-item {
            min-width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #334155, #1e293b);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: var(--text-main);
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .history-ball-item.ball-b { background: linear-gradient(135deg, #0ea5e9, #0284c7); border-color: rgba(14, 165, 233, 0.5); }
        .history-ball-item.ball-i { background: linear-gradient(135deg, #10b981, #059669); border-color: rgba(16, 185, 129, 0.5); }
        .history-ball-item.ball-n { background: linear-gradient(135deg, #f59e0b, #d97706); border-color: rgba(245, 158, 11, 0.5); color: #0f172a; }
        .history-ball-item.ball-g { background: linear-gradient(135deg, #8b5cf6, #7c3aed); border-color: rgba(139, 92, 246, 0.5); }
        .history-ball-item.ball-o { background: linear-gradient(135deg, #f43f5e, #e11d48); border-color: rgba(244, 63, 94, 0.5); }
        
        .history-ball-item.latest {
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            border: 2px solid white;
        }

        /* Contenedor de Cartones */
        .cards-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            width: 92%; 
            max-width: 900px; 
            padding: 10px 0; 
        }

        .bingo-card { 
            background: var(--surface-card); 
            backdrop-filter: blur(20px);
            border-radius: 24px; 
            padding: 18px; 
            border: 1px solid var(--border-glass); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .bingo-card:hover {
            border-color: rgba(14, 165, 233, 0.3);
            transform: translateY(-3px);
        }

        .bingo-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 8px;
        }

        .bingo-header { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 6px; 
            margin-bottom: 6px; 
        }

        .header-cell { 
            color: var(--primary-neon); 
            font-weight: 800; 
            padding: 6px 0; 
            font-size: 14px; 
            text-align: center;
            background: rgba(14, 165, 233, 0.1);
            border-radius: 8px;
        }

        .bingo-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 6px; 
        }

        .cell { 
            aspect-ratio: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.04); 
            font-weight: 700; 
            font-size: 13px; 
            background: rgba(255, 255, 255, 0.02); 
            color: var(--text-main); 
            cursor: pointer; 
            user-select: none;
            transition: all 0.2s ease;
        }
        .cell:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.15); }
        .cell.marked { 
            background: linear-gradient(135deg, #10b981, #059669); 
            color: white; 
            font-weight: 800;
            border-color: transparent;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }
        .cell.free { 
            background: linear-gradient(135deg, #f59e0b, #d97706); 
            color: #0f172a; 
            font-size: 9px; 
            font-weight: 800;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }

        /* Botones de Acción */
        .btn-buy, .btn-bingo { 
            margin-top: 14px; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 13px;
            cursor: pointer; 
            color: white;
            transition: all 0.2s ease;
        }
        .btn-buy { background: linear-gradient(135deg, #f97316, #ea580c); box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3); }
        .btn-buy:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        .btn-bingo { background: linear-gradient(135deg, #f43f5e, #be123c); box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4); }

        /* Widget de Chat con el Administrador Flotante */
        .chat-float-btn {
            position: fixed;
            bottom: 90px;
            right: 20px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 95;
            transition: transform 0.2s;
        }
        .chat-float-btn:hover { transform: scale(1.08); }

        .chat-window {
            position: fixed;
            bottom: 155px;
            right: 20px;
            width: 320px;
            height: 400px;
            background: var(--surface-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            z-index: 96;
            overflow: hidden;
        }
        .chat-window.open { display: flex; }

        .chat-header {
            background: rgba(15, 23, 42, 0.9);
            padding: 12px 16px;
            font-weight: 800;
            font-size: 13px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--primary-neon);
        }

        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-msg {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            word-break: break-word;
        }
        .chat-msg.user { background: rgba(14, 165, 233, 0.2); border: 1px solid rgba(14, 165, 233, 0.3); align-self: flex-end; color: white; }
        .chat-msg.admin { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass); align-self: flex-start; color: var(--text-main); }

        .chat-input-area {
            padding: 10px;
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid var(--border-glass);
            display: flex;
            gap: 6px;
        }
        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 8px 10px;
            color: white;
            font-size: 12px;
            outline: none;
        }
        .chat-send-btn {
            background: var(--primary-neon);
            border: none;
            padding: 0 12px;
            border-radius: 8px;
            font-weight: 700;
            color: #0f172a;
            cursor: pointer;
            font-size: 12px;
        }

        /* Barra Inferior del Cantador */
        .caller-bottom-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: rgba(15, 23, 42, 0.92); 
            backdrop-filter: blur(16px); 
            padding: 14px 24px; 
            z-index: 90; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-top: 1px solid var(--border-glass); 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .current-ball-mobile { 
            width: 52px; 
            height: 52px; 
            line-height: 52px; 
            border-radius: 50%; 
            background: radial-gradient(circle at 30% 30%, #f43f5e, #9f1239); 
            color: white; 
            font-size: 17px; 
            font-weight: 800; 
            text-align: center; 
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.5); 
            border: 2px solid rgba(255,255,255,0.2);
        }

        .empty-state { text-align: center; color: var(--text-muted); grid-column: 1 / -1; padding: 40px 0; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Pantalla de Inicio de Sesión por Clave o Correo -->
    <div id="authOverlay">
        <div class="auth-card">
            <h2>Acceso a Bingo Pro</h2>
            <p>Ingresa con tu correo electrónico o clave personal</p>
            <input type="text" id="authInput" class="auth-input" placeholder="Correo electrónico o Clave Personal">
            <button class="btn-auth" onclick="handleLogin()">Ingresar al Juego</button>
        </div>
    </div>

    <div class="economy-bar">
        <div class="badges-group">
            <div class="diamond-badge">💎 <span id="diamondCount">100</span></div>
            <button onclick="toggleAudio()" id="audioToggleBtn" class="audio-toggle-badge">🔊 Voz: Activada</button>
        </div>
        <div class="user-info-badge" id="userInfoDisplay">Usuario: --</div>
    </div>

    <div class="room-nav">
        <button class="tab-btn active" id="tabGeneral" onclick="switchRoom('general')">🏪 Tienda de Cartones</button>
        <button class="tab-btn" id="tabPrivate" onclick="switchRoom('private')">🔒 Mis Cartones</button>
    </div>

    <!-- Historial de Pelotas Sacadas -->
    <div class="history-container">
        <div class="history-header">
            <span>HISTORIAL DE PELOTAS SACADAS</span>
            <span id="totalBallsCount">0 cantadas</span>
        </div>
        <div class="history-balls-scroll" id="historyBallsScroll">
            <div style="color: var(--text-muted); font-size: 12px; font-weight: 600; padding: 6px 0;">Aún no se han sacado pelotas...</div>
        </div>
    </div>

    <main id="app" style="width: 100%; display: flex; justify-content: center;"></main>

    <!-- Botón y Ventana de Chat con el Administrador -->
    <button class="chat-float-btn" onclick="toggleChat()" title="Soporte Admin">💬</button>
    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <span>Soporte / Administrador</span>
            <span onclick="toggleChat()" style="cursor: pointer; font-size: 14px;">✕</span>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg admin">¡Hola! Escríbenos si tienes alguna duda con tu cuenta o los cartones.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" class="chat-input" placeholder="Escribe tu mensaje..." onkeypress="if(event.key==='Enter') sendChatMessage()">
            <button class="chat-send-btn" onclick="sendChatMessage()">Enviar</button>
        </div>
    </div>

    <div class="caller-bottom-bar">
        <div>
            <div style="font-size: 10px; color: var(--text-muted); font-weight: 800; letter-spacing: 0.5px;">ESTADO DE PARTIDA</div>
            <div id="lastBallText" style="font-weight: 700; font-size: 14px; color: var(--primary-neon);">Esperando partida...</div>
        </div>
        <div class="current-ball-mobile" id="currentBallMini">--</div>
    </div>

    <script>
        let socket = { on: function(){}, emit: function(){} };
        if (!window.socketFailed && typeof io === 'function') {
            socket = io();
        }

        const CARD_PRICE = 10;
        let currentRoom = 'general';
        let userId = '';
        let diamonds = 100;
        let boughtCardsMap = {};
        let markedCellsMap = {};
        let drawnBalls = [];
        let gameRound = 1;
        let soundEnabled = true;

        function handleLogin() {
            const val = document.getElementById('authInput').value.trim();
            if (!val) {
                alert("Por favor ingresa un correo electrónico o una clave válida.");
                return;
            }
            userId = val;
            document.getElementById('userInfoDisplay').innerText = `ID/Correo: ${userId}`;
            document.getElementById('authOverlay').style.display = 'none';
            updateUI();
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('audioToggleBtn');
            if (soundEnabled) {
                btn.innerHTML = "🔊 Voz: Activada";
                btn.classList.remove('muted');
            } else {
                btn.innerHTML = "🔇 Voz: Silenciada";
                btn.classList.add('muted');
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
            }
        }

        function speakBall(letter, number) {
            if (!soundEnabled) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const textToSpeech = `Bola ${letter} ${number}`;
                const utterance = new SpeechSynthesisUtterance(textToSpeech);
                utterance.lang = 'es-ES';
                utterance.rate = 1.1;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function toggleChat() {
            const win = document.getElementById('chatWindow');
            win.classList.toggle('open');
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            const chatMessages = document.getElementById('chatMessages');
            
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'chat-msg user';
            userMsgDiv.innerText = msg;
            chatMessages.appendChild(userMsgDiv);

            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            socket.emit('client_support_message', { userId, message: msg });

            setTimeout(() => {
                const adminMsgDiv = document.createElement('div');
                adminMsgDiv.className = 'chat-msg admin';
                adminMsgDiv.innerText = "Mensaje recibido. Un administrador te responderá en breve.";
                chatMessages.appendChild(adminMsgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 1000);
        }

        socket.on('server_ball_drawn', (data) => {
            drawnBalls = data.drawnBalls;
            
            if (drawnBalls.length > 0) {
                const lastBall = drawnBalls[drawnBalls.length - 1];
                const letter = getBallLetter(lastBall);
                speakBall(letter, lastBall);
            }

            updateUI();
        });

        socket.on('server_reset_game', (data) => {
            drawnBalls = [];
            boughtCardsMap = {};
            markedCellsMap = {};
            if(data && data.gameRound) gameRound = data.gameRound;
            updateUI();
        });

        function getBallLetter(num) {
            return num <= 15 ? 'B' : num <= 30 ? 'I' : num <= 45 ? 'N' : num <= 60 ? 'G' : 'O';
        }

        function getBallClass(num) {
            if (num <= 15) return 'ball-b';
            if (num <= 30) return 'ball-i';
            if (num <= 45) return 'ball-n';
            if (num <= 60) return 'ball-g';
            return 'ball-o';
        }

        function updateUI() {
            document.getElementById('diamondCount').innerText = diamonds;
            
            if (drawnBalls.length > 0) {
                const last = drawnBalls[drawnBalls.length - 1];
                const letter = getBallLetter(last);
                document.getElementById('currentBallMini').innerText = `${letter}-${last}`;
                document.getElementById('lastBallText').innerText = `Jugando en tiempo real (${drawnBalls.length} bolas)`;
            } else {
                document.getElementById('currentBallMini').innerText = '--';
                document.getElementById('lastBallText').innerText = `Esperando partida...`;
            }

            const historyScroll = document.getElementById('historyBallsScroll');
            const totalCountEl = document.getElementById('totalBallsCount');
            
            historyScroll.innerHTML = '';
            totalCountEl.innerText = `${drawnBalls.length} cantadas`;

            if (drawnBalls.length === 0) {
                historyScroll.innerHTML = `<div style="color: var(--text-muted); font-size: 12px; font-weight: 600; padding: 6px 0;">Aún no se han sacado pelotas...</div>`;
            } else {
                const reversedBalls = [...drawnBalls].reverse();
                reversedBalls.forEach((ballNum, index) => {
                    const ballDiv = document.createElement('div');
                    const letter = getBallLetter(ballNum);
                    const colorClass = getBallClass(ballNum);
                    
                    ballDiv.className = `history-ball-item ${colorClass}`;
                    if (index === 0) ballDiv.classList.add('latest');
                    
                    ballDiv.innerText = `${letter}${ballNum}`;
                    ballDiv.title = `Número ${ballNum}`;
                    historyScroll.appendChild(ballDiv);
                });
            }

            renderCards();
        }

        function switchRoom(room) {
            currentRoom = room;
            document.getElementById('tabGeneral').classList.toggle('active', room === 'general');
            document.getElementById('tabPrivate').classList.toggle('active', room === 'private');
            updateUI();
        }

        function getSeededNumbers(min, max, count, seed) {
            let numbers = [];
            let currentSeed = seed;
            while (numbers.length < count) {
                let x = Math.sin(currentSeed++) * 10000;
                let randomNum = Math.floor((x - Math.floor(x)) * (max - min + 1)) + min;
                if (!numbers.includes(randomNum)) numbers.push(randomNum);
            }
            return numbers;
        }

        function getCardMatrix(cardNumber) {
            const baseSeed = (cardNumber * 1000) + (gameRound * 100);
            const colB = getSeededNumbers(1, 15, 5, baseSeed + 1);
            const colI = getSeededNumbers(16, 30, 5, baseSeed + 2);
            const colN = getSeededNumbers(31, 45, 4, baseSeed + 3);
            const colG = getSeededNumbers(46, 60, 5, baseSeed + 4);
            const colO = getSeededNumbers(61, 75, 5, baseSeed + 5);

            let matrix = [];
            for (let r = 0; r < 5; r++) {
                let row = [];
                row.push(colB[r]); row.push(colI[r]);
                row.push(r === 2 ? 0 : colN[r < 2 ? r : r - 1]);
                row.push(colG[r]); row.push(colO[r]);
                matrix.push(row);
            }
            return matrix;
        }

        function buyCard(cardNumber) {
            if (drawnBalls.length > 0) { alert("⚠️ La partida ya comenzó. No se pueden comprar cartones."); return; }
            if (diamonds < CARD_PRICE) { alert("❌ No tienes suficientes diamantes."); return; }
            diamonds -= CARD_PRICE;
            boughtCardsMap[cardNumber] = { owner: userId };
            switchRoom('private');
        }

        function toggleCellMark(cardNumber, row, col) {
            const key = `${cardNumber}_${row}_${col}`;
            if (markedCellsMap[key]) delete markedCellsMap[key];
            else markedCellsMap[key] = true;
            updateUI();
        }

        function checkBingo(cardNumber) {
            const matrix = getCardMatrix(cardNumber);
            let hasWon = false;

            for (let r = 0; r < 5; r++) {
                let rowComplete = true;
                for (let c = 0; c < 5; c++) {
                    if (r === 2 && c === 2) continue;
                    if (!markedCellsMap[`${cardNumber}_${r}_${c}`]) { rowComplete = false; break; }
                }
                if (rowComplete) hasWon = true;
            }

            for (let c = 0; c < 5; c++) {
                let colComplete = true;
                for (let r = 0; r < 5; r++) {
                    if (r === 2 && c === 2) continue;
                    if (!markedCellsMap[`${cardNumber}_${r}_${c}`]) { colComplete = false; break; }
                }
                if (colComplete) hasWon = true;
            }

            if (hasWon) {
                socket.emit('player_claim_bingo', { cardNumber, userId, gameRound });
                alert(`🎉 ¡BINGO CANTADO! ¡Felicidades, has completado el Cartón #${cardNumber}!`);
            } else {
                alert("⚠️ Este cartón aún no cumple con ninguna línea completa para BINGO.");
            }
        }

        function renderCards() {
            const app = document.getElementById('app');
            app.innerHTML = '';
            const container = document.createElement('div');
            container.classList.add('cards-container');

            let visibleCount = 0;

            for (let i = 1; i <= 10; i++) {
                const cardInfo = boughtCardsMap[i];
                const isPurchased = !!cardInfo;
                const isOwner = isPurchased && cardInfo.owner === userId;

                if (currentRoom === 'general' && isPurchased) continue;
                if (currentRoom === 'private' && !isOwner) continue;

                visibleCount++;
                const cardDiv = document.createElement('div');
                cardDiv.classList.add('bingo-card');

                cardDiv.innerHTML = `
                    <div class="bingo-card-header">
                        <span style="font-size: 13px; font-weight: 800; color: #38bdf8;">Cartón #${i}</span>
                        <span style="font-size: 11px; font-weight: 700; color: ${isOwner ? '#10b981' : '#64748b'};">${isOwner ? '✓ Adquirido' : 'Disponible'}</span>
                    </div>
                `;

                const header = document.createElement('div');
                header.classList.add('bingo-header');
                ['B', 'I', 'N', 'G', 'O'].forEach(l => header.innerHTML += `<div class="header-cell">${l}</div>`);
                cardDiv.appendChild(header);

                const matrix = getCardMatrix(i);
                const grid = document.createElement('div');
                grid.classList.add('bingo-grid');

                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        const cell = document.createElement('div');
                        cell.classList.add('cell');
                        const val = matrix[r][c];

                        if (r === 2 && c === 2) {
                            cell.innerText = 'FREE';
                            cell.classList.add('free', 'marked');
                        } else {
                            cell.innerText = val;
                            if (markedCellsMap[`${i}_${r}_${c}`]) cell.classList.add('marked');
                            if (isOwner) cell.onclick = () => toggleCellMark(i, r, c);
                        }
                        grid.appendChild(cell);
                    }
                }
                cardDiv.appendChild(grid);

                if (!isPurchased && currentRoom === 'general') {
                    const btnBuy = document.createElement('button');
                    btnBuy.classList.add('btn-buy');
                    if (drawnBalls.length > 0) {
                        btnBuy.innerText = '🚫 Ventas Cerradas';
                        btnBuy.disabled = true;
                    } else {
                        btnBuy.innerText = `Comprar Cartón (💎 ${CARD_PRICE})`;
                        btnBuy.onclick = () => buyCard(i);
                    }
                    cardDiv.appendChild(btnBuy);
                } else if (isOwner) {
                    const btnBingo = document.createElement('button');
                    btnBingo.classList.add('btn-bingo');
                    btnBingo.innerText = '📢 ¡Cantar Bingo!';
                    btnBingo.onclick = () => checkBingo(i);
                    cardDiv.appendChild(btnBingo);
                }
                container.appendChild(cardDiv);
            }

            if (visibleCount === 0) {
                container.innerHTML = `<div class="empty-state">${currentRoom === 'general' ? 'No hay cartones disponibles en este momento.' : 'Aún no has comprado ningún cartón. ¡Adquiere uno en la tienda!'}</div>`;
            }

            app.appendChild(container);
        }
    </script>
</body>
</html>
