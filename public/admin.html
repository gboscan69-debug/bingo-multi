<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Admin - Panel de Control</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        :root {
            --bg-dark: #0f172a; --surface-dark: #1e293b; --primary-neon: #38bdf8;
            --secondary-neon: #818cf8; --accent-pink: #f43f5e; --success-neon: #22c55e;
            --warning-gold: #fbbf24; --text-main: #f8fafc; --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .admin-container { width: 100%; max-width: 600px; background: var(--surface-dark); border: 1px solid rgba(168, 85, 247, 0.4); padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: var(--primary-neon); margin-top: 0; text-align: center; }
        .current-ball-box { display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 16px; margin: 15px 0; }
        .current-ball-display { width: 90px; height: 90px; line-height: 90px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, var(--accent-pink), #be123c); color: white; font-size: 36px; font-weight: 800; text-align: center; box-shadow: 0 0 25px rgba(244, 63, 94, 0.6); margin-bottom: 10px; }
        .admin-controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .btn-admin { color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; text-align: center; }
        .master-board { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; margin-top: 15px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 12px; }
        .master-ball { font-size: 10px; padding: 6px 0; background: rgba(255,255,255,0.03); border-radius: 4px; color: var(--text-muted); font-weight: 700; text-align: center; }
        .master-ball.drawn { background: var(--success-neon); color: #0f172a; box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2>🎛️ Panel de Administrador</h2>
        <div class="current-ball-box">
            <div style="font-size: 11px; color: var(--text-muted); font-weight: 800; margin-bottom: 5px;">BOLA ACTUAL</div>
            <div class="current-ball-display" id="currentBall">--</div>
        </div>
        <div class="admin-controls">
            <button class="btn-admin" style="background-color: var(--success-neon); color: #0f172a;" onclick="startAutoDraw()">▶️ Iniciar Partida</button>
            <button class="btn-admin" style="background-color: var(--warning-gold); color: #0f172a;" onclick="stopAutoDraw()">⏸️ Pausar</button>
            <button class="btn-admin" style="background-color: var(--secondary-neon);" onclick="drawNextBall()">🎲 Sacar 1 Bola</button>
            <button class="btn-admin" style="background-color: var(--accent-pink);" onclick="resetGame()">🔄 Reiniciar Ronda</button>
        </div>
        <div style="font-size: 11px; font-weight: 700; color: var(--primary-neon); margin-top: 15px; text-align: center;">TABLERO MAESTRO (1-75)</div>
        <div class="master-board" id="masterBoard"></div>
    </div>
    <script>
        const socket = io();
        let drawnBalls = [];
        let drawInterval = null;

        function getLetter(num) {
            if (num <= 15) return 'B'; if (num <= 30) return 'I'; if (num <= 45) return 'N'; if (num <= 60) return 'G'; return 'O';
        }

        function drawNextBall() {
            if (drawnBalls.length >= 75) { stopAutoDraw(); return; }
            let nextNum;
            do { nextNum = Math.floor(Math.random() * 75) + 1; } while (drawnBalls.includes(nextNum));
            drawnBalls.push(nextNum);

            updateUI(`${getLetter(nextNum)}-${nextNum}`);
            socket.emit('admin_draw_ball', { drawnBalls });
        }

        function startAutoDraw() {
            if (drawInterval) return;
            drawNextBall();
            drawInterval = setInterval(drawNextBall, 5000);
        }

        function stopAutoDraw() { clearInterval(drawInterval); drawInterval = null; }

        function resetGame() {
            if (confirm("¿Reiniciar la ronda por completo?")) {
                stopAutoDraw();
                drawnBalls = [];
                socket.emit('admin_reset_game');
                updateUI();
            }
        }

        function updateUI(lastBall) {
            const ballDiv = document.getElementById('currentBall');
            const masterBoard = document.getElementById('masterBoard');
            if (lastBall) ballDiv.innerText = lastBall;
            else if (drawnBalls.length > 0) {
                const last = drawnBalls[drawnBalls.length - 1];
                ballDiv.innerText = `${getLetter(last)}-${last}`;
            } else ballDiv.innerText = '--';

            masterBoard.innerHTML = '';
            for (let i = 1; i <= 75; i++) {
                const mBall = document.createElement('div');
                mBall.classList.add('master-ball');
                if (drawnBalls.includes(i)) mBall.classList.add('drawn');
                mBall.innerText = i;
                masterBoard.appendChild(mBall);
            }
        }
        updateUI();
    </script>
</body>
</html>
